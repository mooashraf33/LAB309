<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
         <a href="index.html">Home</a> | 
        <a href="about.html">About</a> | 
        <a href="contact.html">Contact</a>
        <a href="MyTest.html">mytest</a>
    </nav>
    <hr>

    <!-- Main Content -->
    <main>
        <h1>Contact Us</h1>
        <p>Please fill out the form below to get in touch with us.</p>

        <form>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="username" placeholder="Enter your name" required>
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="user_email" placeholder="Enter your email" required>
            <br><br>

            <label for="id_num">ID Number:</label><br>
            <input type="number" id="id_num" name="user_id" placeholder="Enter your ID">
            <br><br>

            <label for="birthdate">Date:</label><br>
            <input type="date" id="birthdate" name="birth_date">
            <br><br>

            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>

            <p>Interests:</p>
            <input type="checkbox" id="option1" name="interest" value="option1">
            <label for="option1">Option 1</label><br>

            <input type="checkbox" id="option2" name="interest" value="option2">
            <label for="option2">Option 2</label><br>

            <input type="checkbox" id="option3" name="interest" value="option3">
            <label for="option3">Option 3</label>
            <br><br>

            <label for="category">Select Option:</label><br>
            <select id="category" name="selected_category">
                <option value="1">Option 1</option>
                <option value="2">Option 2</option>
                <option value="3">Option 3</option>
                <option value="4">Option 4</option>
            </select>
            <br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="user_message" placeholder="Type your message here..."></textarea>
            <br><br>

            <button type="submit">Submit</button>
        </form>
    </main>

</body>
</html>
